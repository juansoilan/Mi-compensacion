<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Clock">
  <rect width="128" height="128" rx="28" fill="#2167AE"/>
  <!-- Dial -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <!-- Hour hand (≈10) -->
  <line
    x1="64" y1="64" x2="64" y2="38"
    stroke="#FFFFFF"
    stroke-width="8"
    stroke-linecap="round"
    transform="rotate(-40 64 64)"
  />
  <!-- Minute hand (≈2) -->
  <line
    x1="64" y1="64" x2="64" y2="28"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linecap="round"
    transform="rotate(50 64 64)"
  />
  <!-- Center pin -->
  <circle cx="64" cy="64" r="5" fill="#FFFFFF"/>
</svg>
